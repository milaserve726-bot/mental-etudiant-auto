name: 👑 MONSTER V10 FINAL ULTIMATE - All in One

on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *'

jobs:
  ultimate-monster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools FAST
        run: |
          wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -O /tmp/ffmpeg.tar.xz
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp
          sudo cp /tmp/ffmpeg-*-static/ffmpeg /usr/local/bin/
          pip install edge-tts google-api-python-client google-auth-oauthlib google-auth-httplib2 Pillow --quiet

      - name: GENERATE EVERYTHING
        run: |
          mkdir -p output
          cat > generate_all.py << 'PY'
          import asyncio, random
          import edge_tts
          from PIL import Image, ImageDraw, ImageFont

          topics_data = [
              {"title": "Comment rester concentre 3h sans pause Methode Sorbonne", "content": "La methode 50-10-2. 50 minutes focus, 10 minutes pause, 2 minutes note. Etude Paris 2024 plus 40 pourcent memorisation. Essaye demain a 9h, ton cerveau est a 100 pourcent. Bois de leau.", "thumb": "FOCUS 3H\nSANS FATIGUE"},
              {"title": "Gerer le stress des partiels 3 techniques qui marchent", "content": "Technique 1 Respiration 4-7-8. Inspire 4, bloque 7, expire 8. Fais 3 fois, stress baisse 50 pourcent. Technique 2 Ecris tes peurs sur papier 5 minutes. Technique 3 Dors 7h minimum. Plus 30 pourcent notes.", "thumb": "STRESS\nPARTIELS"},
              {"title": "Pourquoi tu procrastines et comment arreter aujourd hui", "content": "Ce n est pas de la paresse. C est ton cerveau qui a peur. Solution regle des 5 minutes. Dis je travaille seulement 5 minutes. Ton cerveau accepte et veut continuer. Methode Sciences Po.", "thumb": "STOP\nPROCRASTINATION"},
          ]
          data = random.choice(topics_data)
          title = data["title"]
          full_script = f"{title}. {data['content']} {data['content']} Abonne toi a Mental Etudiant. On publie chaque jour a 19h heure de Paris."

          open("output/title.txt","w",encoding="utf-8").write(title)
          open("output/thumb_text.txt","w",encoding="utf-8").write(data["thumb"])
          open("output/description.txt","w",encoding="utf-8").write(f"{title}\n\n🎓 Mental Etudiant\n📌 {data['content']}\n\n🔔 Abonne-toi 19h Paris\n#etudiant #france #etudes #productivite\nVideo originale avec aide IA montage.")

          # Image fond video avec titre (au lieu de drawtext qui plante)
          W,H = 1920,1080
          img = Image.new('RGB', (W,H), color=(15,23,42))
          draw = ImageDraw.Draw(img)
          for y in range(H):
              r = int(15 + (60-15)*y/H); g = int(23 + (80-23)*y/H); b = int(42 + (120-42)*y/H)
              draw.line([(0,y),(W,y)], fill=(r,g,b))
          try:
              font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 60)
          except:
              font = ImageFont.load_default()
          # Ecrire titre au centre
          bbox = draw.textbbox((0,0), title, font=font)
          w = bbox[2]-bbox[0]
          draw.text(((W-w)//2, 400), title, font=font, fill=(255,255,255), stroke_width=3, stroke_fill=(0,0,0))
          draw.text((W//2-200, 600), "Mental Etudiant - Abonne-toi", font=font, fill=(255,235,59))
          img.save("output/background.jpg", "JPEG", quality=90)

          async def make_voice():
              await edge_tts.Communicate(full_script, "fr-FR-DeniseNeural", rate="+8%").save("output/voice.mp3")
          asyncio.run(make_voice())
          print(f"✅ TITLE: {title}")
          PY
          python generate_all.py

      - name: GENERATE THUMBNAIL VIRAL
        run: |
          cat > thumb.py << 'PY'
          from PIL import Image, ImageDraw, ImageFont
          W,H = 1280,720
          img = Image.new('RGB', (W,H), color=(15,23,42))
          draw = ImageDraw.Draw(img)
          for y in range(H):
              r = int(15 + (139-15)*y/H); g = int(23 + (92-23)*y/H); b = int(42 + (246-42)*y/H)
              draw.line([(0,y),(W,y)], fill=(r,g,b))
          thumb_text = open("output/thumb_text.txt", encoding="utf-8").read().strip()
          try:
              font_big = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 130)
              font_small = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 40)
          except:
              font_big = ImageFont.load_default(); font_small = ImageFont.load_default()
          y_offset = 180
          for line in thumb_text.split('\n'):
              bbox = draw.textbbox((0,0), line, font=font_big); w = bbox[2]-bbox[0]; x = (W-w)//2
              draw.text((x+8, y_offset+8), line, font=font_big, fill=(0,0,0))
              draw.text((x, y_offset), line, font=font_big, fill=(255,235,59))
              y_offset+=160
          draw.rounded_rectangle([(40,620),(400,680)], radius=15, fill=(255,255,255))
          draw.text((60,628), "MENTAL ETUDIANT", font=font_small, fill=(15,23,42))
          draw.rounded_rectangle([(W-250,40),(W-40,100)], radius=15, fill=(255,59,59))
          draw.text((W-230,50), "19H PARIS", font=font_small, fill=(255,255,255))
          img.save("output/thumbnail.jpg", "JPEG", quality=95)
          print("✅ THUMBNAIL READY")
          PY
          python thumb.py

      - name: BUILD 8MIN VIDEO - FIXED NO DRAWTEXT ERROR
        run: |
          # 8min05 = 485 sec - Mid-roll = plus d'argent
          ffmpeg -y -loop 1 -i output/background.jpg -i output/voice.mp3 -c:v libx264 -profile:v baseline -level 4.0 -pix_fmt yuv420p -crf 23 -c:a aac -b:a 192k -ar 48000 -movflags +faststart -shortest -r 30 -t 485 output/mental-etudiant-8min-FINAL.mp4
          ls -lh output/

      - name: UPLOAD YOUTUBE
        env:
          CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          cat > final_upload.py << 'PY'
          import os, sys
          CLIENT_ID = os.environ.get('CLIENT_ID')
          if not CLIENT_ID:
              print("⚠️ Pas de secrets - video en artifact, c'est normal pour premier test")
              sys.exit(0)
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          creds = Credentials(None, refresh_token=os.environ['REFRESH_TOKEN'], token_uri='https://oauth2.googleapis.com/token', client_id=CLIENT_ID, client_secret=CLIENT_SECRET, scopes=['https://www.googleapis.com/auth/youtube.upload'])
          youtube = build('youtube','v3', credentials=creds)
          title = open('output/title.txt', encoding='utf-8').read().strip()
          desc = open('output/description.txt', encoding='utf-8').read()
          req=youtube.videos().insert(part="snippet,status",body={"snippet":{"title":title[:95],"description":desc,"tags":["etudiant france","etudes"],"categoryId":"27"},"status":{"privacyStatus":"public","selfDeclaredMadeForKids":False,"license":"youtube"}},media_body=MediaFileUpload('output/mental-etudiant-8min-FINAL.mp4', resumable=True))
          res=req.execute()
          vid=res['id']
          print(f"✅ VIDEO: https://youtu.be/{vid}")
          try:
              youtube.thumbnails().set(videoId=vid, media_body=MediaFileUpload('output/thumbnail.jpg')).execute()
              print("✅ THUMBNAIL OK")
          except Exception as e:
              print(f"Thumb error: {e}")
          PY
          python final_upload.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MONSTER-V10-FIXED
          path: output/
