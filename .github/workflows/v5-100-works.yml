name: V5 100% WORKS
on:
  workflow_dispatch:
jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - name: Install ffmpeg FAST - no apt
        run: |
          wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -O /tmp/ffmpeg.tar.xz
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp
          sudo cp /tmp/ffmpeg-*-static/ffmpeg /usr/local/bin/
          sudo cp /tmp/ffmpeg-*-static/ffprobe /usr/local/bin/
          ffmpeg -version | head -n 1
          echo "✅ ffmpeg ready"

      - name: Build VIDEO 15s - PHONE COMPATIBLE 100%
        run: |
          mkdir -p output
          ffmpeg -y -f lavfi -i color=c=0x1e3a8a:s=1280x720:d=15:r=30 -f lavfi -i anullsrc=r=48000:cl=stereo -t 15 -c:v libx264 -pix_fmt yuv420p -profile:v high -level 4.0 -crf 23 -c:a aac -b:a 128k -movflags +faststart -shortest output/MENTAL-ETUDIANT-15s-OK.mp4
          ls -lh output/
          ffprobe -v error -show_entries stream=codec_name,pix_fmt -of csv output/MENTAL-ETUDIANT-15s-OK.mp4
          echo "✅ VIDEO 100% PHONE READABLE - yuv420p + faststart"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VIDEO-FINAL-PHONE-OK
          path: output/
