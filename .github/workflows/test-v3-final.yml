name: TEST V3 FINAL - No Text
on:
  workflow_dispatch:
jobs:
  test-video:
    runs-on: ubuntu-latest
    steps:
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build REAL video 15sec - phone compatible
        run: |
          mkdir -p output
          # نجيبو فيديو حقيقي ديال طالب فرنسي
          curl -L -o input.mp4 "https://videos.pexels.com/video-files/3202633/3202633-hd_1280_720_25fps.mp4"
          # نحولوه لكوديك كيخدم فأي تيليفون - بلا نص
          ffmpeg -y -i input.mp4 -t 15 -vf "scale=1280:720" -c:v libx264 -profile:v high -level 4.0 -pix_fmt yuv420p -crf 23 -c:a aac -b:a 128k -movflags +faststart output/MENTAL-ETUDIANT-TEST-15s.mp4
          ls -lh output/
          ffprobe output/MENTAL-ETUDIANT-TEST-15s.mp4
          echo "SUCCESS - VIDEO 100% PHONE COMPATIBLE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VIDEO-TEST-OK-PHONE
          path: output/
          retention-days: 5
