name: TEST FRENCH - 20sec Playable V2
on:
  workflow_dispatch:
jobs:
  test-video:
    runs-on: ubuntu-latest
    steps:
      - name: Install ffmpeg + fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          fc-list

      - name: Download REAL clip
        run: |
          mkdir -p clips output
          curl -L -o clips/base.mp4 "https://videos.pexels.com/video-files/3202633/3202633-hd_1280_720_25fps.mp4"
          ls -lh clips/

      - name: Build 20sec FRENCH - FIXED FONT
        run: |
          FONT="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          ffmpeg -y -i clips/base.mp4 -t 20 -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2:color=black,drawtext=fontfile=$FONT:text='REUSSIR SES ETUDES':fontcolor=white:fontsize=60:x=(w-text_w)/2:y=220:box=1:boxcolor=black@0.6:boxborderw=20,drawtext=fontfile=$FONT:text='Methode simple pour apprendre':fontcolor=white:fontsize=32:x=(w-text_w)/2:y=320:box=1:boxcolor=black@0.4:boxborderw=10" -c:v libx264 -profile:v high -pix_fmt yuv420p -crf 23 -c:a aac -b:a 128k -movflags +faststart -shortest output/test-french-20s.mp4
          
          echo "--- VERIFICATION ---"
          ffprobe -v error -show_entries stream=codec_name,pix_fmt -of csv output/test-french-20s.mp4
          ls -lh output/
          echo "✅ VIDEO OK - PRET POUR TELEPHONE"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TEST-FRENCH-OK-V2
          path: output/
