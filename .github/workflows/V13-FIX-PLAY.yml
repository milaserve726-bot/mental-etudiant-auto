name: V13 FIX PLAY 8MIN
on:
  workflow_dispatch:
jobs:
  v13:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -O /tmp/ffmpeg.tar.xz
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp
          sudo cp /tmp/ffmpeg-*-static/ffmpeg /tmp/ffmpeg-*-static/ffprobe /usr/local/bin/
          pip install edge-tts Pillow --quiet

      - name: Generate
        run: |
          mkdir -p output
          cat > gen.py << 'PY'
          import asyncio, edge_tts
          from PIL import Image, ImageDraw, ImageFont
          text = """Tu n'arrives pas a rester concentre? C'est normal. Aujourd'hui la methode Sorbonne.
          Partie 1: Methode 50-10-2. 50 minutes focus total, 10 minutes pause, 2 minutes ecrire ce que tu as retenu.
          Partie 2: Une etude Paris Cite 2024 montre 40 pourcent de memoire en plus avec 50-10.
          Partie 3: Le matin a 8h ton cerveau est a 100 pourcent. Le soir a 22h il est a 30 pourcent. Fais les matieres dures le matin.
          Partie 4: Mets ton telephone dans une autre piece. Meme eteint il baisse ta concentration de 20 pourcent.
          Partie 5: Bois 500ml d'eau. Ton cerveau est 75 pourcent d'eau. Dehydrate tu perds 15 pourcent.
          Partie 6: Demain 7h du matin, 50 minutes focus, 10 pause, 50 focus. 2h30 de vrai travail vaut mieux que 10h de faux travail.
          Abonne toi Mental Etudiant 19h Paris.""" * 3
          open("output/title.txt","w",encoding="utf-8").write("Rester concentre 8h - Methode Sorbonne")
          img=Image.new('RGB',(1920,1080),color=(15,23,42))
          d=ImageDraw.Draw(img)
          try:
              f=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",60)
          except:
              f=ImageFont.load_default()
          d.text((100,400),"Comment rester concentre 8h",font=f,fill=(255,255,255))
          d.text((100,500),"MENTAL ETUDIANT - 19H PARIS",font=f,fill=(255,235,59))
          img.save("output/bg.jpg","JPEG")
          async def v():
              await edge_tts.Communicate(text, "fr-FR-DeniseNeural").save("output/voice.mp3")
          asyncio.run(v())
          PY
          python gen.py

      - name: BUILD FIXED FOR PHONE
        run: |
          # هادي هي الطريقة اللي كتخدم فالتيليفون 100%
          ffmpeg -y -loop 1 -framerate 1 -i output/bg.jpg -i output/voice.mp3 -c:v libx264 -profile:v baseline -level 3.0 -pix_fmt yuv420p -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2" -c:a aac -b:a 128k -ar 44100 -ac 2 -movflags +faststart -shortest -t 500 output/final-8min.mp4
          ls -lh output/
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/final-8min.mp4

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: V13-8MIN-FIX-PHONE
          path: output/
