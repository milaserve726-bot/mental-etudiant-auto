name: V4 FINAL - 30sec OK
on:
  workflow_dispatch:
jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - run: ffmpeg -version
      - run: |
          mkdir output
          ffmpeg -y -f lavfi -i color=c=blue:s=1280x720:d=15:r=30 -f lavfi -i anullsrc -t 15 -c:v libx264 -pix_fmt yuv420p -c:a aac -movflags +faststart -shortest output/mental-etudiant-TEST-15s.mp4
          ls -lh output/
      - uses: actions/upload-artifact@v4
        with:
          name: TEST-VIDEO-PHONE-OK
          path: output/
