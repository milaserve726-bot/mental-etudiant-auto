name: V11 - 8 MIN REAL 70MB
on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *'

jobs:
  monster-v11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -O /tmp/ffmpeg.tar.xz
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp
          sudo cp /tmp/ffmpeg-*-static/ffmpeg /tmp/ffmpeg-*-static/ffprobe /usr/local/bin/
          pip install edge-tts Pillow --quiet

      - name: GENERATE LONG 8 MIN SCRIPT
        run: |
          mkdir -p output
          cat > gen.py << 'PY'
          import asyncio
          import edge_tts
          from PIL import Image, ImageDraw, ImageFont

          text = """
          Tu n'arrives pas a rester concentre plus de 20 minutes? C'est normal. Ton cerveau n'est pas fait pour rester focus 3 heures d'affilee. Aujourd'hui je te donne la methode exacte de la Sorbonne.
          Partie 1: La methode 50-10-2. Tu travailles 50 minutes a fond. Pas de telephone. Pas de musique avec paroles. Juste toi et ton cours. Apres 50 minutes, tu fais 10 minutes de pause totale. Tu te leves, tu bois de l'eau, tu regardes par la fenetre. Et 2 minutes tu ecris ce que tu as retenu. C'est la partie la plus importante.
          Partie 2: Pourquoi 50 minutes? Une etude de Paris Cite en 2024 a montre que le cerveau retient 40 pourcent de plus quand tu fais 50-10 plutot que 2 heures non stop.
          Partie 3: Le matin a 8h ton cerveau est a 100 pourcent. Le soir a 22h il est a 30 pourcent. Donc revise les matieres difficiles le matin.
          Partie 4: Coupe tout. Mets ton telephone en mode avion et mets le dans une autre piece. Pas dans ta poche. Dans une autre piece.
          Partie 5: La technique de l'eau. Bois 500 millilitres d'eau avant de commencer. Ton cerveau est compose a 75 pourcent d'eau.
          Partie 6: Demain matin essaye. Leve toi a 7h. Bois de l'eau. Coupe ton telephone. Travaille 50 minutes sur une seule matiere. Puis 10 minutes pause. Puis encore 50 minutes.
          """ * 3

          print(f"{len(text.split())} mots = {len(text.split())/130:.1f} min")

          open("output/title.txt","w",encoding="utf-8").write("Comment rester concentre 8h pour reviser sans te fatiguer")
          open("output/thumb_text.txt","w",encoding="utf-8").write("FOCUS 8H\nSANS FATIGUE")
          open("output/description.txt","w",encoding="utf-8").write("Methode Sorbonne pour rester concentre 8h")

          W,H=1920,1080
          img=Image.new('RGB',(W,H),color=(15,23,42))
          d=ImageDraw.Draw(img)
          for y in range(H):
              d.line([(0,y),(W,y)],fill=(15+y//20,23+y//15,42+y//10))
          try:
              f=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",50)
          except:
              f=ImageFont.load_default()
          d.text((100,500),"Comment rester concentre 8h pour reviser",font=f,fill=(255,255,255))
          d.text((100,600),"MENTAL ETUDIANT - 19H PARIS",font=f,fill=(255,235,59))
          img.save("output/background.jpg","JPEG",quality=95)

          async def voice():
              await edge_tts.Communicate(text, "fr-FR-DeniseNeural", rate="+5%").save("output/voice.mp3")
          asyncio.run(voice())
          PY
          python gen.py
          ls -lh output/

      - name: BUILD REAL 8 MIN VIDEO
        run: |
          ffmpeg -y -loop 1 -i output/background.jpg -i output/voice.mp3 -c:v libx264 -pix_fmt yuv420p -crf 22 -c:a aac -b:a 192k -movflags +faststart -shortest -r 30 output/mental-etudiant-8min-REAL.mp4
          ls -lh output/

      - name: THUMBNAIL VIRAL
        run: |
          cat > thumb.py << 'PY'
          from PIL import Image, ImageDraw, ImageFont
          W,H=1280,720
          img=Image.new('RGB',(W,H),color=(15,23,42))
          d=ImageDraw.Draw(img)
          for y in range(H):
              d.line([(0,y),(W,y)],fill=(15+y//10,23+y//10,42+y//5))
          try:
              fb=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",120)
              fs=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",35)
          except:
              fb=ImageFont.load_default(); fs=ImageFont.load_default()
          d.text((200,200),"FOCUS 8H",font=fb,fill=(255,235,59),stroke_width=6,stroke_fill=(0,0,0))
          d.text((200,350),"SANS FATIGUE",font=fb,fill=(255,255,255),stroke_width=6,stroke_fill=(0,0,0))
          d.text((50,630),"MENTAL ETUDIANT",font=fs,fill=(0,0,0))
          img.save("output/thumbnail.jpg","JPEG",quality=95)
          PY
          python thumb.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: V11-8MIN-REAL-70MB
          path: output/
